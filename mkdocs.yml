site_name: HyperAI IDE Tutorial
site_description: Tutorial for the HyperAI IDE component
site_url: https://ide-tutorial.hyperai.di.uoa.gr/
repo_url: https://github.com/donMichaelL/ide-hyperai
edit_uri: edit/master/docs/
copyright: Part of the <a href="https://hyper-ai-project.eu/">HyperAI project</a> &mdash; funded by the European Union
theme:
  name: material
  logo: assets/hyperai.svg
  favicon: assets/hyperai.svg
  font:
    text: Space Grotesk
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.view
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - llmstxt:
      markdown_description: >-
        Tutorial for the IDE component of the EU-funded HYPER-AI project.
        Covers signing in, building application profiles with the HyperAI DSL
        (native and device apps), deploying workflows, and ready-to-use examples.
      full_output: llms-full.txt
      sections:
        Getting started:
          - index.md
          - quick-start-demo.md
        IDE Guide:
          - ide-guide.md
        DSL Specification:
          - dsl/native-apps.md
          - dsl/devices.md
        Examples:
          - cookbook.md
        Hackathon:
          - hyperion-agent.md

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  homepage: https://hyper-ai-project.eu/
  social:
    - icon: material/laptop
      link: https://ide.hyperai.di.uoa.gr/
      name: Open the HyperAI IDE
    - icon: material/web
      link: https://hyper-ai-project.eu/
      name: HyperAI project website

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Introduction: index.md
  - Quick Start Demo: quick-start-demo.md
  - IDE Guide: ide-guide.md
  - DSL Specification:
      - Native Apps: dsl/native-apps.md
      - Device Apps: dsl/devices.md
  - Cookbook & Examples: cookbook.md
  - Hyperion Agent (Hackathon): hyperion-agent.md
